services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easynet}
      POSTGRES_USER: ${POSTGRES_USER:-easynet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - easynet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-easynet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-easynet}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      NODE_ENV: production
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
      SMS_PROVIDER_TOKEN: ${SMS_PROVIDER_TOKEN:-}
      TELEBIRR_API_URL: ${TELEBIRR_API_URL:-}
      TELEBIRR_WEBHOOK_SECRET: ${TELEBIRR_WEBHOOK_SECRET:-}
      CBE_BIRR_API_URL: ${CBE_BIRR_API_URL:-}
      CBE_BIRR_WEBHOOK_SECRET: ${CBE_BIRR_WEBHOOK_SECRET:-}
      QR_RENDER_URL: ${QR_RENDER_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  easynet_pgdata:
